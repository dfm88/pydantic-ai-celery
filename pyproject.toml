[project]
name = "pydantic-ai-celery"
version = "0.1.0"
description = "Durable execution for Pydantic AI agents on Celery."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Diego Margoni", email = "diegof.university@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "celery>=5.3",
    "pydantic-ai>=2.36",
]

[project.optional-dependencies]
redis = ["redis>=5"]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
