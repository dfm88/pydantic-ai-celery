[project]
name = "pydantic-ai-celery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diego Margoni", email = "diegof.university@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "celery>=5.3",
    "pydantic-ai>=2.36",
]

[project.optional-dependencies]
redis = ["redis>=5"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
pydantic-ai-celery = "pydantic_ai_celery:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
